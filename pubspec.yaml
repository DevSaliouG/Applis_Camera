name: si_capture_2
description: "Application de capture et gestion de médias - SilicCapture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  device_preview: ^1.3.1
  photo_view: ^0.14.0
  flutter_colorpicker: ^1.0.3
  cupertino_icons: ^1.0.8

  # Camera & Media
  camera: ^0.10.6
  image_picker: ^1.1.2
  video_player: ^2.7.2
  video_player_web: ^2.0.20

  # Database & Storage
  sqflite: ^2.2.8+3
  path: ^1.8.3
  path_provider: ^2.1.0
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.0.5
  flutter_secure_storage: ^9.0.0
  flutter_secure_storage_web: ^1.1.2

  # QR Code
  mobile_scanner: ^3.4.1

  # PDF & Sharing
  pdf: ^3.10.2
  printing: ^5.11.1
  share_plus: ^7.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  image: ^4.0.17

  # Web specific
  universal_html: ^2.2.4
  js: ^0.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true